[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind-transcription"
version = "0.1.0"
description = "EchoMind real-time Chinese captions MVP"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["echomind*"]
