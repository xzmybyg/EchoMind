[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind-transcription"
version = "0.1.1"
description = "EchoMind real-time Chinese captions MVP"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.24,<3",
    "httpx>=0.27,<1",
    "sounddevice>=0.5,<0.6",
    "opencc-python-reimplemented>=0.1.7,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
desktop-build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["echomind*"]
